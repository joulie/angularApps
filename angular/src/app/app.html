
<ng-container *ngIf="isLoginRoute(); else mainApp">
  <router-outlet></router-outlet>
</ng-container>
<ng-template #mainApp>
  <div style="display: flex; min-height: 100vh;">
    <aside style="width: 260px; border-right: 1px solid #eee;">
      <app-navigation></app-navigation>
    </aside>
    <main style="flex: 1; padding: 24px; width: 100%;">
      <div style="display: flex; justify-content: flex-end; align-items: center; min-height: 48px; margin-bottom: 1.5em;">
        <app-logout></app-logout>
      </div>
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-template>
