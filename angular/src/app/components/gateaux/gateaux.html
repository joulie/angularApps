
<div class="gateaux-container">
	<h2>Nos pâtisseries à vendre</h2>
	<div class="gateaux-grid">
		<div class="gateau-item" *ngFor="let patisserie of patisseries">
			<img [src]="patisserie.image" [alt]="patisserie.nom" />
			<div class="gateau-nom">{{ patisserie.nom }}</div>
			<button (click)="selectionner(patisserie.nom)">Sélectionner</button>
		</div>
	</div>
</div>

<div class="popin-backdrop" *ngIf="popinVisible" (click)="fermerPopin()">
	<div class="popin" (click)="$event.stopPropagation()">
		<img [src]="popinGateau?.image" [alt]="popinGateau?.nom" class="popin-img" />
		<div class="popin-nom">{{ popinGateau?.nom }}</div>
		<button class="popin-close" (click)="fermerPopin()">Fermer</button>
	</div>
</div>
