<div *ngIf="!loggedIn()" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh;">
  <img src="https://cdn.pixabay.com/photo/2017/01/10/19/05/warehouse-1970630_1280.jpg" alt="Inventaire" style="max-width: 320px; border-radius: 12px; box-shadow: 0 2px 8px #0002; margin-bottom: 2rem;" />
  <h2>Bienvenue sur InventaireFrontend</h2>
  <p style="margin-bottom: 2rem; color: #555;">Connectez-vous avec Google pour accéder à la gestion de votre inventaire.</p>
  <div #googleBtn></div>
</div>
<div *ngIf="loggedIn()">
  <p>Bienvenue, {{ user()?.name }}</p>
  <img [src]="user()?.picture" *ngIf="user()?.picture" width="50" />
  <button (click)="signOut()">Se déconnecter</button>
</div>
